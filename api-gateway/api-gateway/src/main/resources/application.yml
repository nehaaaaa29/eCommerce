spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**
          filters:
            - StripPrefix=1
            - name: LoggingOrdersFilter
            - name: Authentication
              args:
                isEnabled: true

        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/inventory/**
          filters:
            - StripPrefix=2
            - AddRequestHeader=X-custom-Header,Neha
            - name: Authentication
              args:
                isEnabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
