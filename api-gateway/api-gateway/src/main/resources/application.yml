jwt:
  secretKey:nehaaaaaaidontknoeyouuuu



spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true # Yeh add karna zaroori hai taaki Eureka se automatic routes ban sakein
      routes:
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/orders/**
          filters:
              - StripPrefix=2
              - name: LoggingOrdersFilter
              - name: Authentication
                args:
                  isEnabled: true
        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/inventory/**
          filters:
            - StripPrefix=2
            - AddRequestHeader=X-custom-Header,Neha

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka